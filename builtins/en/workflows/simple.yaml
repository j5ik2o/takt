name: simple
description: A lightweight development workflow with the same structure as pure, where TAKT selects applicable domain facets per change. AI antipattern and architecture guidance are always included.
all_steps:
  rules:
    - ref: findings-handling
      position: before_instruction
    - ref: plain-terminology
      position: before_instruction

max_steps: 30
facet_pools:
  coding-facets:
    uses: coding-facets
capabilities:
  - readonly
initial_step: plan
loop_monitors:
  # supervise → remediation is the outer round trip where supervise returns after a child fix.
  # Child-engine steps never enter the parent history, so only this outer cycle is counted here.
  - cycle:
      - supervise
      - remediation
    threshold: 3
    judge:
      input_reports:
        - from_step: remediation
          reports: [review-resolution.md]
          history: {previous: 2}
        - from_step: supervise
          reports: [supervisor-validation.md]
          history: {previous: 2}
      persona: supervisor
      instruction: loop-monitor-reviewers-fix
      rules:
        - condition: 'Healthy: fixes are progressing and the reports are converging'
          next: supervise
        - condition: The finding is progressing toward resolution with new diffs, verification results, or knowledge, so another confirmation is needed
          next: supervise
        - condition: >-
            The same finding and cause repeat without new related diffs, verification results, or knowledge,
            so this loop sees no progress.
          next: ABORT
        - condition: No feasible remedy exists that satisfies the requirements
          next: ABORT
  # follow-up-review → remediation → follow-up-review; a different period from the child fix monitor.
  - cycle:
      - follow-up-review
      - remediation
    threshold: 4
    judge:
      input_reports:
        - from_step: remediation
          reports: [fix-plan.md, fix-report.md, fix-verification.md]
          history: {previous: 2}
        - from_step: follow-up-review
          reports: [coding-review.md]
          history: {previous: 2}
      persona: supervisor
      instruction: loop-monitor-reviewers-fix
      rules:
        - condition: 'Healthy: fixes are progressing and the reports are converging'
          next: follow-up-review
        - condition: The finding is progressing toward resolution with new diffs, verification results, or knowledge, so another confirmation is needed
          next: follow-up-review
        - condition: The same finding repeats with no new related diffs, verification results, or knowledge
          next: ABORT
        - condition: No feasible remedy exists that satisfies the requirements
          next: ABORT
steps:
  - name: plan
    capabilities:
      - readonly
    uses: development-core-plan
    with:
      plan_policy:
        - design-planning
      plan_knowledge:
        - architecture
      plan_instruction: simple-plan
      plan_report_format: plan
    rules:
      - condition: Requirements are clear and implementation is feasible
        next: write_tests
      - condition: The user is asking a question rather than requesting implementation
        next: COMPLETE
      - condition: Requirements are unclear or information is insufficient
        next: ABORT
        appendix: |
          Questions:
          - {Question 1}
          - {Question 2}

  - name: write_tests
    capabilities:
      - edit
    uses: development-core-write-tests
    with:
      testing_policy:
        - coding
        - testing
      testing_knowledge:
        - architecture
        - unit-testing
        - e2e-testing
      testing_instruction: simple-write-tests-first
      testing_report_format: test-report
    rules:
      - condition: Test work is complete
        next: implement
      - condition: Necessary tests cannot be created until after implementation
        next: implement
      - condition: Test creation cannot proceed
        next: plan
      - condition: User input is required to resolve a question
        next: write_tests
        requires_user_input: true
        interactive_only: true

  - name: implement
    capabilities:
      - edit
    uses: development-core-implement
    with:
      development_policy:
        - coding
        - testing
        - ai-antipattern
      development_knowledge:
        - architecture
      implementation_instruction: simple-implement-after-tests
      scope_report_format: coder-scope
    dynamic_facets:
      pool: coding-facets
    rules:
      - condition: Implementation completed
        next: review
      - condition: The plan needs revision
        next: plan
      - condition: Unable to proceed with implementation
        next: ABORT
      - condition: User input is required to resolve a question
        next: implement
        requires_user_input: true
        interactive_only: true

  - name: review
    uses: simple-coding-review
    with:
      review_policy:
        - review
        - coding
        - testing
        - ai-antipattern
      review_knowledge:
        - architecture
        - unit-testing
        - e2e-testing
      review_instruction:
        simple-review-coding
    dynamic_facets:
      pool: coding-facets
    rules:
      - condition: approved
        next: supervise
      - condition: needs_fix
        next: remediation

  - name: follow-up-review
    input_reports:
      from_step: remediation
      reports:
        - fix-plan.md
        - fix-report.md
        - fix-verification.md
    uses: simple-coding-review
    with:
      review_policy:
        - review
        - coding
        - testing
        - ai-antipattern
      review_knowledge:
        - architecture
        - unit-testing
        - e2e-testing
      review_instruction:
        simple-review-coding
    dynamic_facets:
      pool: coding-facets
    rules:
      - condition: approved
        next: supervise
      - condition: needs_fix
        next: remediation

  - name: remediation
    uses: review-remediation
    with:
      plan_policy:
        - review
        - coding
        - testing
        - ai-antipattern
      fix_policy:
        - coding
        - testing
        - ai-antipattern
      verification_policy:
        - review
        - coding
        - testing
        - ai-antipattern
      fix_knowledge:
        - architecture
        - unit-testing
        - e2e-testing
    rules:
      - condition: COMPLETE
        next: follow-up-review
      - condition: no_fix
        next: supervise
      - condition: need_replan
        next: plan
      - condition: ABORT
        next: ABORT

  - name: supervise
    description: Compare current code against requirements and preceding findings to decide completion, repair, or waiting for external confirmation.
    input_reports:
      from_step: remediation
      reports:
        - review-resolution.md
      optional_if_unrun: true
    tags:
      - review
      - final-gate
      - supervise
    edit: false
    persona: supervisor
    policy:
      - process-deviation
      - contract-change
      - review
      - coding
      - testing
      - ai-antipattern
    knowledge:
      - architecture
      - unit-testing
      - e2e-testing
    pass_previous_response: false
    instruction: simple-supervise
    output_contracts:
      report:
        - name: supervisor-validation.md
          format: supervisor-validation
        - name: summary.md
          format: supervisor-summary
    rules:
      - condition: BLOCKED
        next: ABORT
      - condition: APPROVE
        next: COMPLETE
      - condition: REJECT
        next: remediation
